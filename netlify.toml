# OsirisZk Mars Pathfinder — Netlify yayın ayarı
# Derleme yok: dosyalar olduğu gibi yayımlanır. Oyun motoru (Python) tarayıcıda Pyodide ile çalışır.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*.py"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 3B oyunun canlı hava verisi (Perseverance MEDA): tarayıcının CORS sınırını aşmak için vekil adres.
# GitHub Pages'te bu yoktur; oyun orada yayımlanmış MEDA aralığıyla (çevrimdışı model) çalışır.
[[redirects]]
  from = "/nasa/mars/*"
  to = "https://mars.nasa.gov/:splat"
  status = 200
